<section class="card" aria-labelledby="task-list-heading">
  <div class="list-head">
    <h2 id="task-list-heading">Tasks</h2>
    <div class="filters" role="group" aria-label="Filter tasks">
      @for (mode of filters; track mode) {
        <button
          type="button"
          [class.active]="filter() === mode"
          [attr.aria-pressed]="filter() === mode"
          (click)="selectFilter(mode)"
        >
          {{ filterLabels[mode] }}
        </button>
      }
    </div>
  </div>

  @if (visibleItems().length === 0) {
    <p class="empty">{{ emptyMessage() }}</p>
  } @else {
    <ul class="list">
      @for (todo of visibleItems(); track todo.id) {
        <li [class.done]="todo.done" [class.editing]="editingId() === todo.id">
          <label class="check">
            <input type="checkbox" [checked]="todo.done" (change)="toggle(todo.id)" />
            <span>{{ todo.title }}</span>
          </label>
          <div class="row-actions">
            <button type="button" (click)="edit(todo)">Edit</button>
            <button type="button" (click)="remove(todo.id)">Delete</button>
          </div>
        </li>
      }
    </ul>
  }
</section>
