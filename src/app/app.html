<app-header />

<main class="page">
  <p class="lede">
    @if (openCount() === 1) {
      1 open task.
    } @else {
      {{ openCount() }} open tasks.
    }
  </p>

  <div class="page__columns">
    <app-todo-form [todo]="editing()" (finished)="finishEdit()" />
    <app-todo-list
      [editingId]="editing()?.id ?? null"
      (edited)="startEdit($event)"
      (removed)="clearRemovedEdit($event)"
    />
  </div>
</main>

<app-footer />
